name: kromia_core
description: >-
  Espejo Dart del SDK @kromia/core (TypeScript). Modelo del editor de Kromia:
  clasificacion field -> slot + compatibilidad de protocolo. La paridad
  cross-language se garantiza por el corpus de tests (mismos inputs, mismos
  outputs que el TS). El cliente Flutter consume este paquete.
version: 5.2.0
publish_to: none

# La version DEBE matchear @kromia/core (packages/core/package.json#version).
# El drift-CI (KRO-64) compara ambas: si el TS bumpea major sin alinear este
# pubspec, abre issue automatica en Jira.

environment:
  sdk: '>=3.0.0 <4.0.0'

# pointycastle: verificación ECDSA P-256 (KRO-16, card_qr.dart). Pura Dart, sin
# plugins nativos → corre igual en `dart test` y en la app Flutter. Espeja el uso
# de WebCrypto del TS (mismo P1363).
dependencies:
  pointycastle: ^3.9.1

dev_dependencies:
  test: ^1.24.0
