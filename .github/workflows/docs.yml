# KRO-87 V3 — Build + deploy de las docs MkDocs Material a GitHub Pages.
#
# Trigger: push a main que toque docs/, mkdocs.yml o este workflow.
# Output: site/ buildeado y publicado en la branch gh-pages.
#
# Setup inicial requerido en GitHub (una sola vez):
#   1. Settings → Pages → Source: "Deploy from a branch" → gh-pages / root
#   2. Permissions → Actions → "Read and write permissions" (para que la
#      action pueda crear/empujar la branch gh-pages)
#
# Tras el primer run, el sitio está disponible en:
#   https://luishidalgoa.github.io/kromia-sdk/

name: Deploy MkDocs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  # Permite trigger manual desde la UI de Actions.
  workflow_dispatch:

permissions:
  contents: write  # necesario para empujar a gh-pages

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Publica en ~30 s. Igual que el drift: el tope existe para que un
    # cuelgue no se lleve las 6 horas del límite por defecto.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # fetch-depth: 0 daría el git-revision-date-localized plugin
          # toda la historia si lo añadimos en el futuro. Por ahora 1.
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          # SIN `cache: pip`. La caché de pip exige un requirements.txt o un
          # pyproject.toml del que derivar la clave, y este repo no tiene
          # ninguno: mkdocs-material se instala suelto en el paso siguiente. Con
          # la caché activada el job muere en el setup con «No file matched to
          # [**/requirements.txt or **/pyproject.toml]» — mismo tropiezo que tuvo
          # el job de paridad con setup-node v5 y su caché de pnpm.

      - name: Install MkDocs Material
        run: |
          pip install --upgrade pip
          pip install mkdocs-material

      - name: Build
        run: mkdocs build --strict

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force --no-history
